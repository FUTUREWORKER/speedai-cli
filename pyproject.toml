[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedai-cli"
version = "0.3.0"
description = "Speed AI CLI for user-authorized system media generation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "Future Worker" }
]
keywords = ["speed-ai", "speedai", "cli", "agent", "image-generation", "video-generation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Internet :: WWW/HTTP"
]

[project.urls]
Homepage = "https://github.com/FUTUREWORKER/speedai-cli"
Repository = "https://github.com/FUTUREWORKER/speedai-cli"

[project.scripts]
speedai = "speedai_cli:main"

[tool.setuptools]
py-modules = ["speedai_cli"]
include-package-data = true
